name = "resonant-mind"
main = "src/index.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# REQUIRED: create a Cloudflare Hyperdrive configuration backed by Neon,
# then uncomment this block and insert its non-secret binding ID.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"

# Visual memory storage. Change the bucket name for your deployment.
[[r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "resonant-mind-images"

# Workers AI composes the manifest layer of dreams.
[ai]
binding = "AI"

# Subconscious metabolism.
[triggers]
crons = ["*/30 * * * *"]

# Required secrets (set with `wrangler secret put`):
# MIND_API_KEY
# GEMINI_API_KEY
#
# Optional secrets:
# SIGNING_SECRET          - dedicated HMAC key for signed image URLs
# MCP_CONNECTOR_SECRET    - compatibility connector path secret
# WEATHER_API_KEY         - WeatherAPI.com key
#
# Optional variables:
# WORKER_URL              - public worker origin, required for signed images
# LOCATION_NAME           - WeatherAPI-compatible location query
# LOCATION_TIMEZONE       - IANA timezone for deployment-specific scheduling
# DASHBOARD_ALLOWED_ORIGIN - explicit CORS origin for a future separate client
