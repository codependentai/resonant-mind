name: verify

on:
  push:
    branches: [master, "refeed/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan:release
      - run: npm audit --audit-level=moderate
      - run: npx wrangler deploy --dry-run --outdir /tmp/resonant-mind-worker
